# Settings for the real-Overcooked experiments on the UMIACS cluster. These are
# what slurm/submit_overcooked.sh passes; results are in the README. Population
# and partner choices live in experiment.py.
adaptive_ensemble:
  advantage: actor_critic
  embed_dim: 32
  encoder_hidden: 64
  weighting_hidden: 64
  n_iterations: 1000
  episodes_per_iteration: 64
  partners_per_iteration: 8
  horizon: 400
  # about 20 seconds per iteration on one rtxa4000: 5-6 hours per run

evaluation:
  n_episodes_per_partner: 20  # in each player position
