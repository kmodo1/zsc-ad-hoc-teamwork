# Larger-scale settings for the real experiments on the UMIACS GPU cluster
# (Section 4: "If larger GPUs are required, some of our members have access
# to the UMIACS cluster"). These are starting points, not tuned values --
# expect to need to retune entropy_coef / lr once the real Overcooked env
# (via envs/zsceval_adapter.py) replaces the lightweight gridworld.
population:
  n_policies: 8           # a real population needs more diverse members
  n_iterations: 5000
  episodes_per_iteration: 32
  horizon: 400
  hidden_size: 128
  entropy_coef: 0.02

crossplay:
  n_episodes: 30

adaptive_ensemble:
  embed_dim: 32
  n_iterations: 3000
  episodes_per_iteration: 16

evaluation:
  n_episodes_per_partner: 30
